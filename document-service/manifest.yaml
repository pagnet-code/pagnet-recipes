apiVersion: pagnet.dev/v1
kind: Service
metadata:
  name: document-service
  description: Extracts document content; schema'd capability, async completion
capabilities:
  - id: documents.extract
    version: 1
    description: Extract document content
    inputSchema:
      type: object
      properties:
        uri:
          type: string
      required: [uri]
    outputSchema:
      type: object
      properties:
        text:
          type: string
    tags: [documents]
permissions:
  requested: []
